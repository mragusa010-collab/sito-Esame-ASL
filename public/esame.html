<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esame di Teoria · Soccorritori ASL Napoli</title>
<style>
:root{--bg:#EEF1F5;--panel:#fff;--ink:#16202B;--muted:#5B6B7A;--line:#D6DCE3;--navy:#0B2A4A;--red:#C62828;--green:#1E7D32;--gold:#C98A12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141A;--panel:#17202B;--ink:#EAF0F6;--muted:#93A2B2;--line:#2A3642}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,system-ui,sans-serif}
button{font:inherit;cursor:pointer}input,textarea{font:inherit}
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;max-width:420px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.crest{width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 10px}
.ttl{text-align:center;font-weight:800;font-size:1.1rem;letter-spacing:.02em}
.sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:18px}
.f{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;letter-spacing:.02em}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);width:auto}
.btn.sm{width:auto;padding:8px 14px;font-weight:600}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.85rem;width:100%;margin-top:12px}
.hide{display:none!important}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.topbar b{letter-spacing:.02em}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem;background:#fff2;padding:4px 14px;border-radius:8px}
.timer.low{background:var(--red)}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin-bottom:18px}
.nbtn{height:36px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.nbtn.ans{background:var(--green);color:#fff;border-color:var(--green)}
.nbtn.cur{outline:3px solid var(--gold)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
.qn{color:var(--muted);font-weight:700;margin-bottom:8px}
.qtext{font-size:1.15rem;font-weight:600;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:10px}
.opt.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.navbar{display:flex;gap:10px;margin-top:18px}
.navbar .btn{width:auto;padding:12px 20px}
.big{font-size:3rem;font-weight:800;text-align:center;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--panel)}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.code{font-family:monospace}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.tab.on{background:var(--navy);color:#fff}
.qedit{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.qedit input{margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center}
.cred{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:10px;font-family:monospace}
</style>
</head>
<body>

<div id="login" class="center">
<div class="card">
<div class="crest">🏥</div>
<div class="ttl">ESAME DI TEORIA</div>
<div class="sub">Corso Soccorritori · ASL Napoli</div>
<input class="f" id="u" placeholder="Nome utente">
<input class="f" id="p" type="password" placeholder="Password">
<button class="btn" id="loginBtn">ACCEDI ALL'ESAME</button>
<button class="link" id="showAdmin">Area istruttori</button>
</div>
</div>

<div id="adminGate" class="center hide">
<div class="card">
<div class="crest">🔑</div>
<div class="ttl">AREA ISTRUTTORI</div>
<input class="f" id="au" placeholder="Nome utente">
<input class="f" id="ap" type="password" placeholder="Password">
<button class="btn gold" id="adminBtn">Accedi</button>
<button class="link" id="backLogin">← Torna al login candidato</button>
</div>
</div>

<div id="admin" class="hide">
<div class="topbar">🏥<b>PANNELLO ISTRUTTORI</b><span style="margin-left:auto"></span><button class="btn ghost sm" onclick="location.reload()">Esci</button></div>
<div class="wrap">
<div class="tabs"><button class="tab on" id="tabCand">Candidati</button><button class="tab" id="tabQ">Domande</button></div>

<div id="candPane">
<div class="card" style="max-width:none;margin-bottom:18px">
<input class="f" id="candName" placeholder="Nome e cognome del candidato">
<button class="btn gold" id="genBtn">Genera credenziali</button>
<div id="genOut"></div>
</div>
<table id="candTbl"><thead><tr><th>Utente</th><th>Candidato</th><th>Stato</th><th>Esito</th></tr></thead><tbody></tbody></table>
</div>

<div id="qPane" class="hide">
<div id="qList"></div>
<button class="btn ghost sm" id="addQ">+ Aggiungi domanda</button>
<button class="btn gold" id="saveQ" style="width:auto;padding:10px 18px;margin-left:10px">Salva domande</button>
</div>
</div>
</div>

<div id="exam" class="hide">
<div class="topbar">🏥<b>ESAME DI TEORIA</b><span class="timer" id="timer">30:00</span></div>
<div class="wrap">
<div class="navgrid" id="navgrid"></div>
<div class="qcard">
<div class="qn" id="qn"></div>
<div class="qtext" id="qtext"></div>
<div id="opts"></div>
</div>
<div class="navbar">
<button class="btn ghost" id="prevB">← Indietro</button>
<button class="btn ghost" id="nextB">Avanti →</button>
<span style="flex:1"></span>
<button class="btn" id="submitB" style="background:var(--red)">CONSEGNA ESAME</button>
</div>
</div>
</div>

<div id="result" class="center hide">
<div class="card">
<div class="crest">🏥</div>
<div class="ttl">RISULTATO ESAME</div>
<div class="big" id="scoreBig"></div>
<p id="scoreMsg" style="text-align:center"></p>
</div>
</div>

<script>
const ADMIN_USER='ISTRUTTORE-ASL-NAPOLI', ADMIN_PASS='c0rs1naples2026', PASS_PCT=0.8, DURATION=30*60*1000;
const DEFAULT_Q=[
['Quali sono i cinque dati da comunicare al 112/118?',['Dove, cosa è successo, quante persone, come stanno, chi sei','Solo l\'indirizzo','Nome del paziente e codice fiscale','Il numero di targa dei veicoli coinvolti'],0],
['Cosa significa il codice C02 K?',['Patologia respiratoria, in strada','Patologia cardiocircolatoria, in casa','Trauma, in un impianto sportivo','Intossicazione, in un esercizio pubblico'],1],
['Quale lettera del codice luogo indica la strada?',['K','S','R','P'],1],
['Qual è la prima cosa da fare arrivando sulla scena?',['Iniziare le compressioni','Valutare la sicurezza della scena','Chiamare il 112/118','Applicare il DAE'],1],
['Cosa si valuta con la lettera C della sequenza ABCDE?',['Il circolo: polso ed emorragie','Il colore degli occhi','La capacità di parlare','Il livello di stress del soccorritore'],0],
['Per quanto tempo al massimo si controlla il respiro (GAS)?',['30 secondi','20 secondi','10 secondi','5 minuti'],2],
['Qual è il rapporto tra compressioni e ventilazioni nell\'adulto?',['15:2','30:2','10:1','5:1'],1],
['A che profondità si comprime il torace in un adulto?',['1-2 cm','3-4 cm','5-6 cm','8-10 cm'],2],
['A che frequenza si eseguono le compressioni toraciche?',['60-80 al minuto','100-120 al minuto','150-180 al minuto','40-50 al minuto'],1],
['Dove si posizionano le piastre del DAE?',['Entrambe sul petto, vicine','Sotto clavicola destra e fianco sinistro sotto ascella','Sulla fronte e sul torace','Sulle braccia'],1],
['Cosa si fa subito dopo uno shock del DAE?',['Si attende un minuto prima di agire','Si riprende subito la RCP','Si controlla il polso per 30 secondi','Si toglie il DAE'],1],
['Persona cosciente con tosse debole per ostruzione: cosa si fa?',['Si aspetta che si risolva da sola','Colpi interscapolari e compressioni addominali alternati','Si inizia subito la RCP','Si dà da bere'],1],
['Quando si usa la posizione laterale di sicurezza (PLS)?',['Paziente cosciente e collaborante','Paziente incosciente che non respira','Paziente incosciente che respira normalmente','Paziente con trauma cervicale sospetto'],2],
['Cosa si fa con un oggetto conficcato in una ferita?',['Si rimuove subito','Non si rimuove: si blocca e si attendono i soccorsi','Si spinge più a fondo','Si ignora'],1],
['Quando è giustificato spostare un ferito da trauma?',['Mai, in nessun caso','Solo se lo chiede lui','Solo in caso di pericolo immediato (fuoco, crolli, traffico)','Sempre, per comodità'],2]
];
let db=null, Q=DEFAULT_Q, curUser='', deadline=0, cur=0, answers=[], timerId=null;
const $=id=>document.getElementById(id);
function show(id){['login','adminGate','admin','exam','result'].forEach(s=>$(s).classList.toggle('hide',s!==id));}
async function getDb(){ try{ return await claude.use('db'); }catch(e){ return null; } }
function randStr(n){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<n;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

async function loadQuestions(){
  db=db||await getDb(); if(!db){ Q=DEFAULT_Q; return; }
  const doc=await db.doc('exam/questions').get().catch(()=>null);
  Q = (doc&&doc.data&&doc.data.list&&doc.data.list.length) ? doc.data.list : DEFAULT_Q;
}

$('showAdmin').onclick=()=>show('adminGate');
$('backLogin').onclick=()=>show('login');
$('adminBtn').onclick=async ()=>{
  if($('au').value.trim()===ADMIN_USER && $('ap').value===ADMIN_PASS){
    db=db||await getDb(); await loadQuestions(); await renderCands(); renderQEdit(); show('admin');
  } else alert('Credenziali non valide.');
};
$('tabCand').onclick=()=>{ $('tabCand').classList.add('on'); $('tabQ').classList.remove('on'); $('candPane').classList.remove('hide'); $('qPane').classList.add('hide'); };
$('tabQ').onclick=()=>{ $('tabQ').classList.add('on'); $('tabCand').classList.remove('on'); $('qPane').classList.remove('hide'); $('candPane').classList.add('hide'); };

$('genBtn').onclick=async ()=>{
  const name=$('candName').value.trim(); if(!name){ alert('Inserisci nome e cognome.'); return; }
  db=db||await getDb(); if(!db){ alert('Servizio non disponibile.'); return; }
  const doc=await db.doc('exam/candidates').get().catch(()=>null);
  const cands=(doc&&doc.data)||{};
  const user='CND-'+randStr(5), pass=randStr(8);
  cands[user]={password:pass,name,used:false};
  await db.doc('exam/candidates').set(cands).catch(()=>{});
  $('genOut').innerHTML='<div class="cred">Utente: <b>'+user+'</b><br>Password: <b>'+pass+'</b><br><small>Comunica queste credenziali al candidato.</small></div>';
  $('candName').value='';
  renderCands();
};
async function renderCands(){
  db=db||await getDb(); if(!db) return;
  const doc=await db.doc('exam/candidates').get().catch(()=>null);
  const cands=(doc&&doc.data)||{};
  const rows=Object.keys(cands).sort().map(u=>{
    const v=cands[u];
    const stato=v.used?'<span class="bad">Completato</span>':(v.startedAt?'<span class="ok">In corso</span>':'<span class="ok">Non iniziato</span>');
    const esito=v.used?(v.pct>=PASS_PCT?'<span class="ok">Superato '+v.score+'/'+v.total+'</span>':'<span class="bad">Non superato '+v.score+'/'+v.total+'</span>'):'—';
    return '<tr><td class="code">'+u+'</td><td>'+(v.name||'—')+'</td><td>'+stato+'</td><td>'+esito+'</td></tr>';
  }).join('');
  $('candTbl').querySelector('tbody').innerHTML = rows || '<tr><td colspan="4" style="color:var(--muted)">Nessun candidato.</td></tr>';
}
function renderQEdit(){
  $('qList').innerHTML = Q.map((q,i)=>`<div class="qedit" data-i="${i}">
    <input class="f qtxt" value="${q[0].replace(/"/g,'&quot;')}" placeholder="Testo della domanda">
    ${q[1].map((o,j)=>`<div class="row"><input type="radio" name="c${i}" ${j===q[2]?'checked':''} class="corr" data-j="${j}"><input class="f opt${j}" value="${o.replace(/"/g,'&quot;')}" placeholder="Risposta ${j+1}"></div>`).join('')}
    <button class="btn ghost sm delQ">Elimina domanda</button></div>`).join('');
  document.querySelectorAll('.delQ').forEach(b=>b.onclick=()=>{ const i=+b.closest('.qedit').dataset.i; Q.splice(i,1); renderQEdit(); });
}
$('addQ').onclick=()=>{ Q.push(['Nuova domanda',['Risposta 1','Risposta 2','Risposta 3','Risposta 4'],0]); renderQEdit(); };
$('saveQ').onclick=async ()=>{
  const out=[];
  document.querySelectorAll('.qedit').forEach(el=>{
    const txt=el.querySelector('.qtxt').value.trim();
    const opts=[0,1,2,3].map(j=>el.querySelector('.opt'+j).value.trim());
    const corr=+el.querySelector('.corr:checked').dataset.j;
    out.push([txt,opts,corr]);
  });
  Q=out;
  db=db||await getDb(); if(db) await db.doc('exam/questions').set({list:Q}).catch(()=>{});
  alert('Domande salvate.');
};

$('loginBtn').onclick=async ()=>{
  const u=$('u').value.trim(), p=$('p').value;
  if(!u||!p){ alert('Inserisci nome utente e password.'); return; }
  db=db||await getDb(); if(!db){ alert('Servizio non disponibile al momento.'); return; }
  const doc=await db.doc('exam/candidates').get().catch(()=>null);
  const cands=(doc&&doc.data)||{};
  const c=cands[u];
  if(!c || c.password!==p){ alert('Credenziali non valide.'); return; }
  if(c.used){ alert('Hai già completato questo esame.'); return; }
  curUser=u;
  if(!c.startedAt){ c.startedAt=Date.now(); cands[u]=c; await db.doc('exam/candidates').set(cands).catch(()=>{}); }
  deadline = c.startedAt + DURATION;
  await loadQuestions();
  answers = new Array(Q.length).fill(-1);
  cur=0; renderExam(); startTimer(); show('exam');
};

function renderNav(){
  $('navgrid').innerHTML = Q.map((_,i)=>`<button class="nbtn ${answers[i]>=0?'ans':''} ${i===cur?'cur':''}" data-i="${i}">${i+1}</button>`).join('');
  document.querySelectorAll('.nbtn').forEach(b=>b.onclick=()=>{ cur=+b.dataset.i; renderExam(); });
}
function renderExam(){
  renderNav();
  $('qn').textContent='DOMANDA '+(cur+1)+' DI '+Q.length;
  $('qtext').textContent=Q[cur][0];
  $('opts').innerHTML = Q[cur][1].map((o,j)=>`<button class="opt ${answers[cur]===j?'sel':''}" data-j="${j}">${o}</button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ answers[cur]=+b.dataset.j; renderExam(); });
  $('prevB').disabled=cur===0;
  $('nextB').classList.toggle('hide',cur===Q.length-1);
}
$('prevB').onclick=()=>{ if(cur>0){cur--;renderExam();} };
$('nextB').onclick=()=>{ if(cur<Q.length-1){cur++;renderExam();} };
function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const rem=deadline-Date.now();
    if(rem<=0){ clearInterval(timerId); finish(true); return; }
    const m=Math.floor(rem/60000), s=Math.floor((rem%60000)/1000);
    $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    $('timer').classList.toggle('low', rem<5*60000);
  },500);
}
$('submitB').onclick=()=>{ if(confirm('Confermi la consegna dell\'esame?')) finish(false); };
async function finish(timeout){
  clearInterval(timerId);
  let score=0; Q.forEach((q,i)=>{ if(answers[i]===q[2]) score++; });
  const pct=score/Q.length;
  const doc=await db.doc('exam/candidates').get().catch(()=>null);
  const cands=(doc&&doc.data)||{};
  if(cands[curUser]) Object.assign(cands[curUser],{used:true,score,total:Q.length,pct,ts:Date.now()});
  await db.doc('exam/candidates').set(cands).catch(()=>{});
  $('scoreBig').innerHTML = pct>=PASS_PCT? '<span class="ok">'+score+'/'+Q.length+'</span>' : '<span class="bad">'+score+'/'+Q.length+'</span>';
  $('scoreMsg').innerHTML = (timeout?'Tempo scaduto. ':'')+(pct>=PASS_PCT? 'Esame superato. ':'Esame non superato. ')+'Soglia richiesta: '+Math.round(PASS_PCT*100)+'%.';
  show('result');
}
</script>
</body>
</html>

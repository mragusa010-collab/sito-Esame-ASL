<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esame di Teoria · Soccorritori ASL Napoli</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#EEF1F5;--panel:#fff;--ink:#16202B;--muted:#5B6B7A;--line:#D6DCE3;--navy:#0B2A4A;--red:#C62828;--green:#1E7D32;--gold:#C98A12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141A;--panel:#17202B;--ink:#EAF0F6;--muted:#93A2B2;--line:#2A3642}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,system-ui,sans-serif}
button{font:inherit;cursor:pointer}input,textarea,select{font:inherit}
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px;max-width:550px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.crest{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:block;object-fit:cover;border:2px solid var(--navy)}
.ttl{text-align:center;font-weight:800;font-size:1.1rem;letter-spacing:.02em}
.sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:18px}
.f{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
textarea.f{min-height:80px;resize:vertical}
.btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;letter-spacing:.02em}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);width:auto}
.btn.sm{width:auto;padding:8px 14px;font-weight:600;font-size:.85rem}
.btn.danger{background:var(--red);color:#fff}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.85rem;width:100%;margin-top:12px}
.hide{display:none!important}
.warn{background:#FFF3CD;border:1px solid #E7C66B;color:#6B4E00;padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:14px}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.topbar .crest{width:34px;height:34px;margin:0;border-width:1px;flex-shrink:0}
.topbar b{letter-spacing:.02em}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:1.2rem;background:#fff2;padding:4px 14px;border-radius:8px}
.timer.low{background:var(--red)}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.secLbl{color:var(--muted);font-weight:700;font-size:.78rem;letter-spacing:.04em;margin:14px 0 6px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin-bottom:10px}
.nbtn{height:36px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:700}
.nbtn.ans{background:var(--green);color:#fff;border-color:var(--green)}
.nbtn.cur{outline:3px solid var(--gold)}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:10px}
.scen{background:var(--bg);border-left:4px solid var(--gold);padding:12px 14px;border-radius:6px;margin-bottom:14px;font-size:.92rem}
.qn{color:var(--muted);font-weight:700;margin-bottom:8px}
.qtext{font-size:1.1rem;font-weight:600;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-top:10px}
.opt.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.navbar{display:flex;gap:10px;margin-top:18px}
.navbar .btn{width:auto;padding:12px 20px}
.big{font-size:2.6rem;font-weight:800;text-align:center;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--panel);margin-top:10px}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.cred{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:10px;font-family:monospace}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tab.on{background:var(--navy);color:#fff}
.q-item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>

<!-- LOGIN CANDIDATO -->
<div id="login" class="center">
<div class="card">
<img class="crest logo-img" src="" alt="Logo">
<div class="ttl">ESAME DI TEORIA</div>
<div class="sub">Corso Soccorritori · ASL Napoli</div>
<input class="f" id="u" placeholder="Nome utente">
<input class="f" id="p" type="password" placeholder="Password">
<button class="btn" id="loginBtn">ACCEDI ALL'ESAME</button>
<button class="link" id="showAdmin">Area istruttori</button>
</div>
</div>

<!-- GATE ADMIN -->
<div id="adminGate" class="center hide">
<div class="card">
<img class="crest logo-img" src="" alt="Logo">
<div class="ttl">AREA ISTRUTTORI</div>
<input class="f" id="au" placeholder="Nome utente">
<input class="f" id="ap" type="password" placeholder="Password">
<button class="btn gold" id="adminBtn">Accedi</button>
<button class="link" id="backLogin">← Torna al login candidato</button>
</div>
</div>

<!-- PANNELLO ADMIN -->
<div id="admin" class="hide">
<div class="topbar"><img class="crest logo-img" src="" alt="Logo"><b>PANNELLO ISTRUTTORI</b><span style="margin-left:auto"></span><button class="btn ghost sm" style="color:#fff;border-color:#fff" onclick="location.reload()">Esci</button></div>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" id="tabUsersBtn" onclick="switchAdminTab('users')">Gestione Utenti</button>
    <button class="tab" id="tabQuestionsBtn" onclick="switchAdminTab('questions')">Gestione Domande</button>
  </div>

  <!-- TAB UTENTI -->
  <div id="tabUsers">
    <div class="card" style="max-width:none;margin-bottom:18px">
      <h3>Crea Nuove Credenziali Candidate</h3>
      <input class="f" id="candUser" placeholder="Username Candidato (es. candidato1)">
      <input class="f" id="candPass" placeholder="Password">
      <button class="btn gold" id="genBtn">Genera e Salva in Database</button>
      <div id="genOut"></div>
    </div>
  </div>

  <!-- TAB DOMANDE -->
  <div id="tabQuestions" class="hide">
    <div class="card" style="max-width:none;margin-bottom:18px">
      <h3 id="qFormTitle">Aggiungi Nuova Domanda</h3>
      <input type="hidden" id="editQIdx" value="-1">
      <textarea class="f" id="qScenInp" placeholder="Scenario clinico / Contesto (opzionale)"></textarea>
      <textarea class="f" id="qTextInp" placeholder="Testo della domanda"></textarea>
      <input class="f" id="opt0" placeholder="Opzione 1">
      <input class="f" id="opt1" placeholder="Opzione 2">
      <input class="f" id="opt2" placeholder="Opzione 3">
      <input class="f" id="opt3" placeholder="Opzione 4">
      <label style="display:block;margin:10px 0 6px;font-weight:700">Seleziona Risposta Corretta:</label>
      <select class="f" id="correctOpt">
        <option value="0">Opzione 1</option>
        <option value="1">Opzione 2</option>
        <option value="2">Opzione 3</option>
        <option value="3">Opzione 4</option>
      </select>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn gold" id="saveQBtn">Salva Domanda</button>
        <button class="btn ghost hide" id="cancelQBtn" onclick="resetQForm()">Annulla</button>
      </div>
    </div>

    <h3>Elenco Domande Attuali</h3>
    <div id="qList"></div>
  </div>
</div>
</div>

<!-- SCHERMATA ESAME -->
<div id="exam" class="hide">
<div class="topbar"><img class="crest logo-img" src="" alt="Logo"><b>ESAME DI TEORIA</b><span class="timer" id="timer">30:00</span></div>
<div class="wrap">
<div class="secLbl" id="secLbl"></div>
<div class="navgrid" id="navgrid"></div>
<div class="qcard">
<div class="qn" id="qn"></div>
<div class="scen hide" id="scen"></div>
<div class="qtext" id="qtext"></div>
<div id="opts"></div>
</div>
<div class="navbar">
<button class="btn ghost" id="prevB">← Indietro</button>
<button class="btn ghost" id="nextB">Avanti →</button>
<span style="flex:1"></span>
<button class="btn" id="submitB" style="background:var(--red)">CONSEGNA ESAME</button>
</div>
</div>
</div>

<!-- RISULTATO -->
<div id="result" class="center hide">
<div class="card">
<img class="crest logo-img" src="" alt="Logo">
<div class="ttl">RISULTATO ESAME</div>
<div class="big" id="scoreBig"></div>
<p id="scoreMsg" style="text-align:center"></p>
</div>
</div>

<script>
const LOGO_URL = 'https://via.placeholder.com/64';
const ADMIN_USER = 'ISTRUTTORE-ASL-NAPOLI';
const ADMIN_PASS = 'c0rs1naples2026';
const DURATION = 30 * 60 * 1000;

// TUTTE LE 10 DOMANDE ORIGINALI (Con Scenari Clinici)
const DEFAULT_MCQ = [
  ['Quali sono i cinque dati essenziali da comunicare immediatamente alla Centrale Operativa 112/118 durante una chiamata di soccorso?', ['Dove, cosa è successo, quante persone, come stanno, chi sei', 'Nome, cognome, codice fiscale, numero di telefono e medico curante', 'Solo l\'indirizzo esatto e il numero civico', 'Marca del veicolo, targa, colore e modello dell\'auto coinvolta'], 0, ''],
  ['Nel sistema di codifica territoriale dell\'emergenza, cosa indica specificamente il codice diagnostico "C02 K"?', ['Patologia cardiocircolatoria, evento avvenuto in casa/abitazione privata', 'Patologia respiratoria, evento avvenuto su strada pubblica', 'Trauma grave, evento avvenuto all\'interno di un impianto sportivo', 'Intossicazione acuta, evento avvenuto all\'interno di un esercizio pubblico'], 0, ''],
  ['Nella codifica della tipologia di luogo utilizzata dal sistema 118, quale lettera identifica la "Strada"?', ['K', 'S', 'R', 'P'], 1, ''],
  ['Durante l\'arrivo sul luogo dell\'evento, qual è la primissima azione imprescindibile che il team di soccorso deve compiere?', ['Eseguire immediatamente la valutazione primaria del paziente (ABCDE)', 'Valutare la sicurezza della scena per proteggere sé stessi, la squadra e gli astanti', 'Richiedere subito l\'intervento dell\'elisoccorso', 'Applicare immediatamente le piastre del Defibrillatore Semiautomatico (DAE)'], 1, ''],
  ['Qual è il rapporto corretto tra compressioni toraciche esterne ed insufflazioni nella Rianimazione Cardio-Polmonare (RCP) dell\'adulto?', ['15 compressioni alternate a 2 insufflazioni', '30 compressioni alternate a 2 insufflazioni', '30 compressioni alternate a 5 insufflazioni', 'Compressioni continue senza mai eseguire insufflazioni'], 1, ''],
  ['In un paziente adulto privo di conoscenza e che non respira normalmente, qual è la sequenza prioritaria delle manovre BLSD?', ['Chiamare i soccorsi/DAE, valutare la sicurezza, iniziare 30 compressioni toraciche', 'Sicurezza della scena, valutazione dello stato di coscienza e del respiro, chiamata di soccorso e DAE, inizio compressioni (30:2)', 'Posizionare la persona in Posizione Laterale di Sicurezza e attendere l\'ambulanza', 'Eseguire subito 5 ventilazioni di soccorso prima di effettuare qualsiasi controllo'], 1, ''],
  ['Quale codice colore identifica un paziente con patologia grave, potenziale rischio vitale o compromissione di una funzione vitale?', ['Codice Verde', 'Codice Giallo', 'Codice Rosso', 'Codice Bianco'], 2, ''],
  ['Durante la gestione di un paziente traumatizzato, la manovra di immobilizzazione del rachide cervicale deve essere effettuata:', ['Solo dopo aver caricato il paziente all\'interno dell\'ambulanza', 'Immediatamente all\'inizio della valutazione, mantenendo la testa in posizione neutra manuale', 'Soltanto se il paziente lamenta dolore intenso al collo', 'Esclusivamente in presenza dell\'Istruttore o del Medico di centrale'], 1, ''],
  ['Cosa identifica la lettera "C" nella valutazione primaria dello schema ABCDE?', ['Controllo dello stato di Coscienza (Consciousness)', 'Circolo ed eventuale controllo delle emorragie imponenti (Circulation)', 'Controllo delle Vie Aeree (Airway)', 'Compromissione neurologica e pupille (Disability)'], 1, ''],
  ['A quale tipologia di evento corrisponde la sigla di luogo "P"?', ['Strada pubblica o autostrada', 'Impianto sportivo o ricreativo', 'Luogo pubblico o aperto al pubblico', 'Abitazione privata o domicilio'], 2, '']
];

let MCQ = JSON.parse(localStorage.getItem('asl_questions')) || DEFAULT_MCQ;
let curUser='', deadline=0, cur=0, answers=[], timerId=null;
const $=id=>document.getElementById(id);

document.querySelectorAll('.logo-img').forEach(img => img.src = LOGO_URL);

function show(id){['login','adminGate','admin','exam','result'].forEach(s=>$(s).classList.toggle('hide',s!==id));}

$('showAdmin').onclick=()=>show('adminGate');$('backLogin').onclick=()=>show('login');

$('adminBtn').onclick=()=>{
  if($('au').value.trim()===ADMIN_USER &&$('ap').value===ADMIN_PASS){
    show('admin');
    renderQList();
  } else alert('Credenziali Admin non valide.');
};

function switchAdminTab(tab){
  $('tabUsers').classList.toggle('hide', tab!=='users');$('tabQuestions').classList.toggle('hide', tab!=='questions');
  $('tabUsersBtn').classList.toggle('on', tab==='users');$('tabQuestionsBtn').classList.toggle('on', tab==='questions');
}

// REGISTRAZIONE UTENTE CANDIDATO SU SUPABASE
$('genBtn').onclick=async ()=>{
  const username=$('candUser').value.trim();
  const password=$('candPass').value.trim();
  if(!username || !password){ alert('Inserisci sia Username che Password.'); return; }

  try {
    const res = await fetch('/api/admin/create-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, ruolo: 'candidato' })
    });
    const data = await res.json();
    if(res.ok) {
      $('genOut').innerHTML = '<div class="cred">Utente <b>'+username+'</b> salvato con successo nel Database!</div>';
      $('candUser').value = '';$('candPass').value = '';
    } else alert('Errore: ' + data.error);
  } catch(e) {
    alert('Errore di rete nell\'invio dati.');
  }
};

// GESTIONE DOMANDE ADMIN
function renderQList(){
  $('qList').innerHTML = MCQ.map((q, idx) => `
    <div class="q-item">
      <div>
        <strong>${idx + 1}. ${q[0]}</strong>
        ${q[3] ? `<div style="font-size:0.8rem;color:var(--gold)">Scenario: ${q[3]}</div>` : ''}
        <div style="color:var(--muted);font-size:0.85rem">Corretta: ${q[1][q[2]]}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn sm ghost" onclick="editQ(${idx})">Modifica</button>
        <button class="btn sm danger" onclick="deleteQ(${idx})">Elimina</button>
      </div>
    </div>
  `).join('');
}

$('saveQBtn').onclick = () => {
  const scen = $('qScenInp').value.trim();
  const text = $('qTextInp').value.trim();
  const opts = [$('opt0').value.trim(),$('opt1').value.trim(), $('opt2').value.trim(),$('opt3').value.trim()];
  const correct = parseInt($('correctOpt').value);
  const editIdx = parseInt($('editQIdx').value);

  if(!text || opts.some(o => !o)){ alert('Compila il testo e tutte e 4 le risposte.'); return; }

  if(editIdx >= 0) {
    MCQ[editIdx] = [text, opts, correct, scen];
  } else {
    MCQ.push([text, opts, correct, scen]);
  }

  localStorage.setItem('asl_questions', JSON.stringify(MCQ));
  resetQForm();
  renderQList();
};

function editQ(idx){
  const q = MCQ[idx];
  $('qScenInp').value = q[3] \vert{}\vert{} '';$('qTextInp').value = q[0];
  $('opt0').value = q[1][0];$('opt1').value = q[1][1];
  $('opt2').value = q[1][2];$('opt3').value = q[1][3];
  $('correctOpt').value = q[2];$('editQIdx').value = idx;
  $('qFormTitle').textContent = 'Modifica Domanda #' + (idx + 1);
  $('cancelQBtn').classList.remove('hide');
}

function deleteQ(idx){
  if(confirm('Sei sicuro di voler eliminare questa domanda?')){
    MCQ.splice(idx, 1);
    localStorage.setItem('asl_questions', JSON.stringify(MCQ));
    renderQList();
  }
}

function resetQForm(){
  $('qScenInp').value = '';$('qTextInp').value = '';
  $('opt0').value = '';$('opt1').value = ''; $('opt2').value = '';$('opt3').value = '';
  $('correctOpt').value = '0';$('editQIdx').value = '-1';
  $('qFormTitle').textContent = 'Aggiungi Nuova Domanda';$('cancelQBtn').classList.add('hide');
}

// LOGIN E SVOLGIMENTO ESAME CANDIDATO
$('loginBtn').onclick=()=>{
  const u=$('u').value.trim(), p=$('p').value;
  if(!u||!p){ alert('Inserisci nome utente e password.'); return; }

  curUser = u;
  answers = new Array(MCQ.length).fill(null);

  let startTime = localStorage.getItem('esame_start_' + curUser);
  if(!startTime) {
    startTime = Date.now();
    localStorage.setItem('esame_start_' + curUser, startTime);
  }
  deadline = parseInt(startTime) + DURATION;

  cur=0; 
  renderExam(); 
  startTimer(); 
  show('exam');
};

function renderNav(){
  $('navgrid').innerHTML = MCQ.map((_,i)=>`<button class="nbtn ${answers[i]!==null?'ans':''} ${i===cur?'cur':''}" data-i="${i}">${i+1}</button>`).join('');
  document.querySelectorAll('.nbtn').forEach(b=>b.onclick=()=>{ cur=+b.dataset.i; renderExam(); });
}

function renderExam(){
  renderNav();
  $('secLbl').textContent='SEZIONE RISPOSTA MULTIPLA';$('qn').textContent='DOMANDA '+(cur+1)+' DI '+MCQ.length;
  
  if(MCQ[cur][3]){
    $('scen').textContent = 'SCENARIO: ' + MCQ[cur][3];$('scen').classList.remove('hide');
  } else {
    $('scen').classList.add('hide');
  }

  $('qtext').textContent=MCQ[cur][0];$('opts').innerHTML = MCQ[cur][1].map((o,j)=>`<button class="opt ${answers[cur]===j?'sel':''}" data-j="${j}">${o}</button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ answers[cur]=+b.dataset.j; renderExam(); });
  $('prevB').disabled=cur===0;
  $('nextB').classList.toggle('hide',cur===MCQ.length-1);
}

$('prevB').onclick=()=>{ if(cur>0){cur--;renderExam();} };$('nextB').onclick=()=>{ if(cur<MCQ.length-1){cur++;renderExam();} };

function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const rem=deadline-Date.now();
    if(rem<=0){ 
      clearInterval(timerId); 
      localStorage.removeItem('esame_start_' + curUser);
      alert('Tempo scaduto! L\'esame verrà inviato automaticamente.');
      finish(); 
      return; 
    }
    const m=Math.floor(rem/60000), s=Math.floor((rem%60000)/1000);
    $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('timer').classList.toggle('low', rem<5*60000);
  },500);
}

$('submitB').onclick=()=>{ if(confirm('Confermi la consegna dell\'esame?')) finish(); };

// CONSEGNA E INVIO A SUPABASE
async function finish(){
  clearInterval(timerId);
  let score=0;
  MCQ.forEach((q,i)=>{ if(answers[i]===q[2]) score++; });

  const tempoSpeso = Math.floor((DURATION - (deadline - Date.now())) / 1000);

  try {
    const res = await fetch('/api/esame/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: curUser,
        risposte: answers,
        tempoImpiegato: tempoSpeso
      })
    });

    if(res.ok) {
      localStorage.removeItem('esame_start_' + curUser);
      $('scoreBig').innerHTML = '<span class="ok">'+score+'/'+MCQ.length+'</span>';
      $('scoreMsg').innerHTML = 'Esame completato e salvato nel Database!';
      show('result');
    } else {
      alert('Errore durante il salvataggio dell\'esame nel server.');
    }
  } catch(e) {
    alert('Errore di rete durante la consegna.');
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAD ASL Napoli</title>
<style>
:root{--bg:#0B1826;--panel:#0F2033;--card:#152A40;--ink:#EAF1FA;--muted:#93A7BC;--line:#22384E;--navy:#0B2A4A;--gold:#E0A91F;--accent:#2E8BF0;--danger:#E5484D;--ok:#2ea043;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F3F7FC;--panel:#fff;--card:#fff;--ink:#0E2238;--muted:#5A6B7D;--line:#DCE5EF}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
input{font:inherit}
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:380px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.logo b{font-size:1.15rem;letter-spacing:.02em}
input.f{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);margin-bottom:10px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
.btn.gold{background:var(--gold);color:#1a1200}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger)}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:.85rem;width:100%;margin-top:12px}
.hide{display:none!important}
.wait{text-align:center}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--gold);margin:18px auto;animation:p 1.4s infinite}
@keyframes p{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.top .sp{flex:1}
.pill{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.body{flex:1;display:flex;overflow:hidden}
.chat{width:280px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
.chat h4{margin:12px 14px}
.msgs{flex:1;overflow:auto;padding:0 14px}
.msg{margin-bottom:10px;font-size:.88rem}
.msg b{color:var(--gold)}
.chatIn{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chatIn input{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.chatIn button{padding:9px 12px;border:none;border-radius:8px;background:var(--accent);color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.frame{flex:1;border:0;width:100%;background:#000}
.ctrl{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.round.off{background:var(--danger);color:#fff;border-color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:18px;overflow:auto}
.mod{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
.mod.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.mod h5{margin:.2em 0}
.mod small{color:var(--muted)}
.side{width:260px;border-left:1px solid var(--line);background:var(--panel);overflow:auto}
.side h4{margin:12px 14px}
.peer{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:.88rem}
.peer .n{flex:1}
.foot{padding:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<div id="login" class="center">
<div class="card">
<div class="logo">🏥<b>ASL Napoli · FAD</b></div>
<div id="guestBox">
<input class="f" id="nick" placeholder="Il tuo Nickname Roblox" maxlength="24">
<button class="btn" id="joinBtn">Entra nel corso</button>
<button class="link" id="showAdmin">Sei un istruttore? Accedi come admin</button>
</div>
<div id="adminBox" class="hide">
<input class="f" id="au" placeholder="Nome utente">
<input class="f" id="ap" type="password" placeholder="Password">
<button class="btn gold" id="adminBtn">Accedi come amministratore</button>
<button class="link" id="backGuest">← Torna all'ingresso normale</button>
</div>
</div>
</div>

<div id="wait" class="center hide">
<div class="card wait">
<div class="logo">🏥<b>ASL Napoli · FAD</b></div>
<p id="waitHello"></p>
<div class="pulse"></div>
<p style="color:var(--muted)">Il corso non è ancora stato avviato dall'istruttore.<br>Resta su questa pagina: partirà da solo.</p>
</div>
</div>

<div id="picker" class="app hide">
<div class="top">🏥<b>Pannello istruttore</b><span class="pill" id="peerCount">0 collegati</span><span class="sp"></span><button class="btn ghost" id="logout" style="width:auto">Esci</button></div>
<div class="grid" id="modGrid"></div>
<div class="foot"><button class="btn gold" id="startBtn" disabled style="max-width:320px;margin:0 auto;display:block">Seleziona un modulo</button></div>
</div>

<div id="course" class="app hide">
<div class="top">🏥<b id="courseTitle"></b><span class="pill" id="peerCount2">1 collegato</span><span class="sp"></span><button class="btn danger hide" id="endBtn" style="width:auto">Termina corso</button></div>
<div class="body">
<div class="chat"><h4>💬 Chat</h4><div class="msgs" id="msgs"></div>
<div class="chatIn"><input id="chatText" placeholder="Scrivi una risposta…"><button id="chatSend">Invia</button></div></div>
<div class="main"><iframe class="frame" id="slideFrame" allowfullscreen></iframe>
<div class="ctrl">
<button class="round" id="micBtn">🎤</button>
<button class="round" id="camBtn">📷</button>
<span class="pill" id="micLabel">Microfono attivo</span>
</div></div>
<div class="side hide" id="peerSide"><h4>👥 Partecipanti</h4><div id="peerList"></div></div>
</div>
</div>

<script>
const ADMIN_USER='ISTRUTTORE-ASL-NAPOLI', ADMIN_PASS='c0rs1naples2026';
const MODULES=[['socc','Corso Soccorritori','Formazione base soccorritori'],
['inf1','Infermieri · Modulo 1','Ruolo e responsabilità'],['inf2','Infermieri · Modulo 2','Emergenza e comunicazioni'],
['inf3','Infermieri · Modulo 3','Valutazione clinica avanzata'],['inf4','Infermieri · Modulo 4','Farmacologia d\'urgenza'],
['inf5','Infermieri · Modulo 5','BLS-D e ALS di base'],['inf6','Infermieri · Modulo 6','Vie aeree e ventilazione'],
['inf7','Infermieri · Modulo 7','Trauma ed emorragie'],['inf8','Infermieri · Modulo 8','Emergenze speciali'],
['inf9','Infermieri · Modulo 9','Documentazione e medico-legale'],['inf10','Infermieri · Modulo 10','Prove finali']];

const DEFAULT_LINKS={
socc:'https://docs.google.com/presentation/d/1oTtqSOjBqJvBRKHjb7Tht6mSOg713pBwMBIdsKFlnxM/edit',
inf1:'https://docs.google.com/presentation/d/1GxRFtMWrLOTBP86UufsRNVa3HdHCygHxc20ZuSlvmZE/edit',
inf2:'https://docs.google.com/presentation/d/1MXR6NjDocy9K8DN0Ok4RKYtKFLWuIPQ7R9Jt6qyYsY8/edit',
inf3:'https://docs.google.com/presentation/d/1UfMLK-Zgiy-uiSsjzXjcPYovw9zSui3zT8nWKWJ6m8w/edit',
inf4:'https://docs.google.com/presentation/d/1kiXbjrzpxwBOgOU4esegqUJkMnkxRL6OLpfc0eaSAtc/edit',
inf5:'https://docs.google.com/presentation/d/1ZcWPniwD1RlM88i_pBaa6KWnNx_Gl9AS3zBjJ0jzoMU/edit',
inf6:'https://docs.google.com/presentation/d/1JqQqXoV8i9wACKrH5LnQfB0ZDzd1TlIhr_jJn3zkXoc/edit',
inf7:'https://docs.google.com/presentation/d/1TuslZr9B3P4Dnre5Zl5up9qpvwWm_ISdPdzGZsiD_sk/edit',
inf8:'https://docs.google.com/presentation/d/1YVS9mH8-R1ULjw0U9bVzKQP7N3OUY4RZOSCnFlIZug4/edit',
inf9:'https://docs.google.com/presentation/d/1l2Cy4CWns5phD7D_eMvvMORrFCgdpF-7-PYyhPFt8As/edit',
inf10:'https://docs.google.com/presentation/d/1H3mDQG_97cVqh--fvzoye5HBvlsiYT1ok_0i53d3AdA/edit'
};
let nickname='', isAdmin=false, db=null, room=null, selMod=null, links={}, mic=true, cam=true;
const $=id=>document.getElementById(id);
function show(id){['login','wait','picker','course'].forEach(s=>$(s).classList.toggle('hide',s!==id));}

function gEmbed(link){ if(!link) return ''; const m=link.match(/\/presentation\/d\/(?:e\/)?([a-zA-Z0-9-_]+)/); if(!m) return ''; const pub=link.includes('/d/e/'); return 'https://docs.google.com/presentation/d/'+(pub?'e/':'')+m[1]+'/embed?start=false&loop=false&delayms=6000'; }

async function initCaps(){
  try{ db = await claude.use('db'); }catch(e){}
  try{ room = await claude.use('room'); }catch(e){}
  if(room){
    room.onPeers(list=>{
      const n=(list?list.length:0)+1;
      $('peerCount').textContent=n+' collegati'; $('peerCount2').textContent=n+' collegati';
      if(isAdmin){ $('peerSide').classList.remove('hide');
        $('peerList').innerHTML=('<div class="peer"><span class="n">'+esc(nickname)+' (tu)</span></div>'+
          (list||[]).map(p=>`<div class="peer"><span>${p.mic===false?'🔇':'🎤'}</span><span class="n">${esc(p.nickname||'Ospite')}</span></div>`).join(''));
      }
    });
    room.on('chat', m=>addMsg(m.nickname,m.text));
    room.presence({nickname, role:isAdmin?'admin':'guest', mic});
  }
  if(db){
    try{
      const l = await db.doc('room/links').get();
      links = Object.assign({}, DEFAULT_LINKS, (l&&l.data)||{});
      if(isAdmin) db.doc('room/links').set(links).catch(()=>{});
    }catch(e){ links = Object.assign({}, DEFAULT_LINKS); }
    db.doc('room/state').onSnapshot(doc=>{
      const d = doc && doc.data;
      if(d && d.started){
        $('courseTitle').textContent=d.label||'Corso in corso';
        $('slideFrame').src=gEmbed(d.link);
        $('endBtn').classList.toggle('hide', !isAdmin);
        show('course');
      } else if(!isAdmin){ show('wait'); }
    });
  }
}
function esc(s){ return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function addMsg(n,t){ const d=document.createElement('div'); d.className='msg'; d.innerHTML='<b>'+esc(n)+':</b> '+esc(t); $('msgs').appendChild(d); $('msgs').scrollTop=$('msgs').scrollHeight; }

$('showAdmin').onclick=()=>{ $('guestBox').classList.add('hide'); $('adminBox').classList.remove('hide'); };
$('backGuest').onclick=()=>{ $('adminBox').classList.add('hide'); $('guestBox').classList.remove('hide'); };
$('adminBtn').onclick=async ()=>{
  if($('au').value.trim()===ADMIN_USER && $('ap').value===ADMIN_PASS){
    isAdmin=true; nickname='Istruttore';
    await initCaps();
    renderPicker();
    const st = db ? await db.doc('room/state').get().catch(()=>null) : null;
    if(st && st.data && st.data.started){ $('endBtn').classList.remove('hide'); show('course'); $('courseTitle').textContent=st.data.label; $('slideFrame').src=gEmbed(st.data.link); }
    else show('picker');
  } else alert('Credenziali non valide.');
};
$('joinBtn').onclick=async ()=>{
  const v=$('nick').value.trim();
  if(!v){ alert('Inserisci il tuo Nickname Roblox.'); return; }
  nickname=v; isAdmin=false;
  $('waitHello').textContent='Ciao '+nickname+' 👋';
  await initCaps();
  const st = db ? await db.doc('room/state').get().catch(()=>null) : null;
  if(st && st.data && st.data.started){ $('courseTitle').textContent=st.data.label; $('slideFrame').src=gEmbed(st.data.link); show('course'); }
  else show('wait');
};
$('logout').onclick=()=>location.reload();

function renderPicker(){
  $('modGrid').innerHTML = MODULES.map(m=>`<div class="mod" data-k="${m[0]}"><h5>${m[1]}</h5><small>${m[2]}</small><br><small style="color:var(--gold)">${links[m[0]]?'✓ link impostato':'nessun link — clic per impostarlo'}</small></div>`).join('');
  document.querySelectorAll('.mod').forEach(n=>n.onclick=()=>{
    const k=n.dataset.k;
    if(!links[k]){ const l=prompt('Incolla il link di Google Presentazioni per questo modulo (condiviso: chiunque abbia il link):'); if(!l) return; links[k]=l; db&&db.doc('room/links').set(links).catch(()=>{}); }
    selMod=k;
    document.querySelectorAll('.mod').forEach(x=>x.classList.remove('sel')); n.classList.add('sel');
    $('startBtn').disabled=false; $('startBtn').textContent='Avvia: '+MODULES.find(m=>m[0]===k)[1];
  });
}
$('startBtn').onclick=async ()=>{
  if(!selMod) return;
  const label=MODULES.find(m=>m[0]===selMod)[1];
  const link=links[selMod];
  if(db) await db.doc('room/state').set({started:true,moduleKey:selMod,label,link,startedAt:Date.now()}).catch(()=>{});
  $('courseTitle').textContent=label; $('slideFrame').src=gEmbed(link); $('endBtn').classList.remove('hide');
  show('course');
};
$('endBtn').onclick=async ()=>{ if(db) await db.doc('room/state').set({started:false}).catch(()=>{}); selMod=null; renderPicker(); $('startBtn').disabled=true; $('startBtn').textContent='Seleziona un modulo'; show('picker'); };

$('chatSend').onclick=()=>{ const t=$('chatText').value.trim(); if(!t) return; addMsg(nickname,t); room&&room.emit('chat',{nickname,text:t}); $('chatText').value=''; };
$('chatText').addEventListener('keydown',e=>{ if(e.key==='Enter') $('chatSend').click(); });
$('micBtn').onclick=()=>{ mic=!mic; $('micBtn').classList.toggle('off',!mic); $('micLabel').textContent = mic?'Microfono attivo':'Microfono disattivato'; room&&room.presence({nickname,role:isAdmin?'admin':'guest',mic}); };
$('camBtn').onclick=()=>{ cam=!cam; $('camBtn').classList.toggle('off',!cam); room&&room.presence({nickname,role:isAdmin?'admin':'guest',mic,cam}); };
</script>
</body>
</html>
